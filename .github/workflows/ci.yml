name: CI

# Push na main / pull request: testa e compila tudo (os binários ficam nos
# artefatos da execução). Tag vX.Y.Z: faz o mesmo e publica nos Releases.
#   git tag v3.1.0 && git push origin v3.1.0
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o commit exato vai no relatório de travamento (git describe)

      - name: Tag e versão batem
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag é $GITHUB_REF_NAME mas o build.zig.zon diz $v"
            exit 1
          fi
          # a versão que o app mostra e compara (atualização, novidades)
          a=$(sed -n 's/^pub const app_version = "\(.*\)";/\1/p' src/proto.zig)
          if [ "v$a" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag é $GITHUB_REF_NAME mas o src/proto.zig diz $a"
            exit 1
          fi
          # as notas do release saem da seção da versão no CHANGELOG.md
          sh tools/release_notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notas.md"

      - name: Dependências do sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config nasm libgl-dev libportal-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # o cache do build inteiro passa do limite de 2 GB e nunca era salvo
          use-cache: false

      - name: Cache das dependências
        # o zig 0.16 guarda os pacotes baixados em zig-pkg/, no projeto
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pacotes-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pacotes-

      - name: Baixa as dependências
        # downloads.xiph.org às vezes fecha a conexão no meio: tenta de novo
        run: |
          for i in 1 2 3 4 5; do
            zig build --fetch=all && exit 0
            echo "::warning::falhou baixar as dependências (tentativa $i), de novo em $((i * 15)) s"
            sleep $((i * 15))
          done
          exit 1

      - name: Testes
        run: zig build test --summary all

      - name: Build (Windows, servidor)
        # x86_64_v2 = qualquer CPU x86-64 de ~2009 pra cá (openh264 e RNNoise
        # escolhem AVX2 em tempo de execução)
        run: zig build -Dcpu=x86_64_v2 -Drepo=${{ github.repository }} --summary all

      - name: SDK Python e bots (música, telão) contra o servidor recém-compilado
        # cada teste sobe uma sala própria em 127.0.0.1 com o telinha-server do zig-out
        timeout-minutes: 15 # um teste preso (ffmpeg, rede) segurou o job da tag v3.5.0 por 1h30
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install --quiet "cryptography>=42"
          "$RUNNER_TEMP/sdk/bin/python" -m unittest discover -s sdk/python/tests -v
          "$RUNNER_TEMP/sdk/bin/python" -m py_compile bots/musica/musica.py bots/musica/sources.py bots/telao/telao.py sdk/python/examples/*.py
          # o bot de música (sem yt-dlp e sem internet: pasta, cartão, botões, join)
          "$RUNNER_TEMP/sdk/bin/python" -m unittest discover -s bots/musica -v
          # o telão (um vídeo local por http: passa direto, painel, pausar)
          "$RUNNER_TEMP/sdk/bin/python" -m unittest discover -s bots/telao -v

      - name: Build (Linux, glibc 2.31)
        # glibc fixada numa versão velha: roda no Ubuntu/Pop!_OS 20.04 em diante,
        # Debian 11+, Mint 20+, Fedora, Arch... (a glibc só é compatível pra frente)
        run: |
          zig build -Dnative-only -Dtarget=x86_64-linux-gnu.2.31 -Dcpu=x86_64_v2 \
            -Drepo=${{ github.repository }} --prefix linux-out --summary all
          max=$(objdump -T linux-out/bin/telinha | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "glibc exigida: $max"
          if [ "$(printf '%s\nGLIBC_2.31\n' "$max" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::o binário Linux exige $max (o limite é GLIBC_2.31)"
            exit 1
          fi

      - name: Benchmark
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: zig build bench -Dcpu=x86_64_v2

      - name: Empacota
        run: |
          mkdir dist
          cp zig-out/bin/telinha.exe dist/telinha-windows-x86_64.exe
          tar -C linux-out/bin -czf dist/telinha-linux-x86_64.tar.gz telinha
          cp linux-out/bin/telinha dist/telinha-linux-x86_64 # solto (precisa de chmod +x depois de baixar)
          cp zig-out/bin/telinha-server-x86_64 dist/telinha-server-linux-x86_64
          cp zig-out/bin/telinha-server-aarch64 dist/telinha-server-linux-aarch64
          # símbolos dos mesmos binários (pra ler relatórios de travamento: tools/simbolos.py)
          mkdir simbolos
          cp linux-out/bin/telinha.debug simbolos/telinha.debug
          cp zig-out/bin/telinha.pdb simbolos/telinha.pdb
          tar -C simbolos -czf dist/telinha-simbolos.tar.gz telinha.debug telinha.pdb
          # o "o que muda" que o app mostra antes de atualizar (no idioma dele)
          cp CHANGELOG.md CHANGELOG.pt.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Assina o SHA256SUMS
        # o atualizador do app só instala o que vier com esta assinatura (a
        # chave pública está no src/update.zig). Numa tag é obrigatória.
        env:
          CHAVE: ${{ secrets.TELINHA_ASSINATURA }}
        run: |
          if [ -z "$CHAVE" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error::sem o segredo TELINHA_ASSINATURA: a release sairia sem assinatura e o app não atualizaria sozinho"
              exit 1
            fi
            echo "::warning::sem o segredo TELINHA_ASSINATURA: SHA256SUMS sem assinatura (tudo bem fora de uma tag)"
            exit 0
          fi
          umask 077
          printf '%s\n' "$CHAVE" > "$RUNNER_TEMP/chave.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/chave.pem" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/chave.pem"
          # confere com a chave pública que vai no app
          want=$(sed -n 's/.*release_key = hexKey("\([0-9a-f]*\)").*/\1/p' src/update.zig)
          got=$(printf '%s\n' "$CHAVE" | openssl pkey -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d " \n")
          if [ "$want" != "$got" ]; then
            echo "::error::a chave do segredo não é a que o app conhece (src/update.zig)"
            exit 1
          fi
          ls -la dist/SHA256SUMS.sig

      - uses: actions/upload-artifact@v4
        with:
          name: telinha
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "telinha $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notas.md"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do servidor (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
