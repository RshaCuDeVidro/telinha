<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- telinha: husky neon espiando por cima de um terminal (vibe pwnd) -->
  <defs>
    <pattern id="grade" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#9333ea" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="linhas" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonforte" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <clipPath id="fundo"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>

  <g clip-path="url(#fundo)">
    <rect x="8" y="8" width="240" height="240" fill="#050505"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#grade)"/>
    <!-- brilho roxo atrás da cabeça -->
    <circle cx="128" cy="104" r="86" fill="#9333ea" fill-opacity="0.13"/>

    <!-- cabeça: contorno neon (com o "glitch" ciano/fúcsia deslocado) -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M58 150 C56 112 66 92 80 82 L72 32 L114 66 Q128 62 142 66 L184 32 L176 82 C190 92 200 112 198 150" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="5" transform="translate(-3 1)"/>
      <path d="M58 150 C56 112 66 92 80 82 L72 32 L114 66 Q128 62 142 66 L184 32 L176 82 C190 92 200 112 198 150" stroke="#f472b6" stroke-opacity="0.45" stroke-width="5" transform="translate(3 -1)"/>
      <path d="M58 150 C56 112 66 92 80 82 L72 32 L114 66 Q128 62 142 66 L184 32 L176 82 C190 92 200 112 198 150" stroke="url(#borda)" stroke-width="6" filter="url(#neon)"/>
      <!-- dentro das orelhas -->
      <path d="M84 72 L80 48 L102 66" stroke="#d946ef" stroke-opacity="0.7" stroke-width="3"/>
      <path d="M172 72 L176 48 L154 66" stroke="#d946ef" stroke-opacity="0.7" stroke-width="3"/>
      <!-- a máscara do husky (onde o branco começa) e a listra da testa -->
      <path d="M70 140 C72 120 84 106 102 106 C114 106 122 112 128 124 C134 112 142 106 154 106 C172 106 184 120 186 140 Z" fill="#e5e7eb" fill-opacity="0.07" stroke="none"/>
      <path d="M70 140 C72 120 84 106 102 106 C114 106 122 112 128 124 C134 112 142 106 154 106 C172 106 184 120 186 140" stroke="#e5e7eb" stroke-opacity="0.85" stroke-width="3"/>
      <path d="M128 72 V114" stroke="#e5e7eb" stroke-opacity="0.85" stroke-width="3"/>
    </g>

    <!-- olhos: um ciano, um castanho -->
    <g filter="url(#neonforte)">
      <path d="M88 124 Q101 112 114 124 Q101 133 88 124 Z" fill="#06b6d4"/>
      <path d="M142 124 Q155 112 168 124 Q155 133 142 124 Z" fill="#a8652e"/>
    </g>
    <circle cx="101.5" cy="123.5" r="4.4" fill="#050505"/>
    <circle cx="155.5" cy="123.5" r="4.4" fill="#050505"/>
    <circle cx="98.5" cy="120.5" r="1.7" fill="#ffffff"/>
    <circle cx="152.5" cy="120.5" r="1.7" fill="#ffffff"/>

    <!-- focinho -->
    <path d="M117 136 Q128 130 139 136 Q137 144 128 146 Q119 144 117 136 Z" fill="#d946ef" filter="url(#neon)"/>

    <!-- o terminal -->
    <rect x="30" y="148" width="196" height="76" rx="10" fill="#0a050f"/>
    <rect x="30" y="148" width="196" height="76" rx="10" fill="none" stroke="#9333ea" stroke-width="5" filter="url(#neon)"/>
    <!-- >_ em verde de terminal -->
    <g filter="url(#neon)" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M58 170 L76 184 L58 198"/>
    </g>
    <rect x="86" y="194" width="30" height="7" rx="2" fill="#22c55e" filter="url(#neon)"/>
    <!-- "ao vivo" -->
    <circle cx="204" cy="166" r="5" fill="#f43f5e" filter="url(#neon)"/>

    <!-- patinhas na borda -->
    <g fill="#e5e7eb" filter="url(#neon)">
      <rect x="66" y="139" width="38" height="19" rx="9.5"/>
      <rect x="152" y="139" width="38" height="19" rx="9.5"/>
    </g>
    <path d="M78 148 V157 M91 148 V157 M164 148 V157 M177 148 V157" stroke="#0a050f" stroke-width="2.6" stroke-linecap="round"/>

    <!-- glitch: uma fatia deslocada -->
    <rect x="40" y="98" width="70" height="3" fill="#06b6d4" fill-opacity="0.55"/>
    <rect x="150" y="108" width="54" height="2" fill="#f472b6" fill-opacity="0.5"/>

    <!-- linhas de tela antiga -->
    <rect x="8" y="8" width="240" height="240" fill="url(#linhas)"/>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="51" fill="none" stroke="#9333ea" stroke-opacity="0.45" stroke-width="3"/>
</svg>
