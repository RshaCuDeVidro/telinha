<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- telinha: husky neon espiando por cima de um terminal (vibe pwnd) -->
  <defs>
    <pattern id="grade" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#9333ea" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonforte" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="capuz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f52"/>
      <stop offset="1" stop-color="#231b33"/>
    </linearGradient>
    <radialGradient id="irisAzul" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#a5e9ff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0b6fa8"/>
    </radialGradient>
    <radialGradient id="irisMarrom" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ecb070"/>
      <stop offset="0.55" stop-color="#c07a34"/>
      <stop offset="1" stop-color="#7a4518"/>
    </radialGradient>
    <clipPath id="fundo"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>

  <g clip-path="url(#fundo)">
    <rect x="8" y="8" width="240" height="240" fill="#050505"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#grade)"/>
    <circle cx="128" cy="100" r="92" fill="#9333ea" fill-opacity="0.14"/>

    <!-- cabeça (capuz escuro), com orelhas largas de pontas arredondadas -->
    <path id="cabeca" d="M58 152 C50 132 50 110 60 92 L62 44 Q63 26 80 32 L112 62 Q128 57 144 62 L176 32 Q193 26 194 44 L196 92 C206 110 206 132 198 152 Z" fill="url(#capuz)"/>
    <!-- contorno neon com glitch -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <use href="#cabeca" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="5" transform="translate(-3 1)"/>
      <use href="#cabeca" stroke="#f472b6" stroke-opacity="0.4" stroke-width="5" transform="translate(3 -1)"/>
      <use href="#cabeca" stroke="url(#borda)" stroke-width="5.5" filter="url(#neon)"/>
    </g>
    <!-- pelo branco dentro das orelhas -->
    <path d="M70 48 Q71 38 80 42 L102 63 Q88 67 72 80 Z" fill="#ece8f2" fill-opacity="0.9"/>
    <path d="M186 48 Q185 38 176 42 L154 63 Q168 67 184 80 Z" fill="#ece8f2" fill-opacity="0.9"/>

    <!-- máscara branca: sobrancelhas em arco e a ponta escura do capuz descendo entre os olhos -->
    <path d="M56 152 L58 118 C62 98 80 84 100 84 C113 84 121 94 128 108 C135 94 143 84 156 84 C176 84 194 98 198 118 L200 152 Z" fill="#ece8f2"/>
    <!-- tufos de pelo nas bochechas -->
    <path d="M58 118 L48 124 L57 128 L46 136 L56 139 L47 147 L58 150 Z" fill="#ece8f2"/>
    <path d="M198 118 L208 124 L199 128 L210 136 L200 139 L209 147 L198 150 Z" fill="#ece8f2"/>
    <!-- a ponta do capuz (V) mais marcada -->
    <path d="M118 90 Q128 96 128 108 Q128 96 138 90" fill="none" stroke="#231b33" stroke-width="3" stroke-linecap="round"/>

    <!-- olhos amendoados: a íris fica dentro do olho (recortada), um delineado
         fino colado na borda e uma pontinha curta no canto de fora -->
    <clipPath id="olhoE"><path d="M83 103 Q99 91 117 106 Q99 119 83 103 Z"/></clipPath>
    <clipPath id="olhoD"><path d="M173 103 Q157 91 139 106 Q157 119 173 103 Z"/></clipPath>
    <path d="M83 103 Q99 91 117 106 Q99 119 83 103 Z" fill="#120d19"/>
    <path d="M173 103 Q157 91 139 106 Q157 119 173 103 Z" fill="#120d19"/>
    <g clip-path="url(#olhoE)">
      <circle cx="101" cy="105" r="6.8" fill="url(#irisAzul)"/>
      <circle cx="101" cy="105" r="3.3" fill="#050505"/>
      <circle cx="99.3" cy="102.6" r="1.4" fill="#ffffff"/>
    </g>
    <g clip-path="url(#olhoD)">
      <circle cx="155" cy="105" r="6.8" fill="url(#irisMarrom)"/>
      <circle cx="155" cy="105" r="3.3" fill="#050505"/>
      <circle cx="153.3" cy="102.6" r="1.4" fill="#ffffff"/>
    </g>
    <g fill="#231b33">
      <path d="M83 103 Q80 101.2 77.8 99.4 Q80.8 103.6 84.6 105.2 Z"/>
      <path d="M173 103 Q176 101.2 178.2 99.4 Q175.2 103.6 171.4 105.2 Z"/>
    </g>
    <g fill="none" stroke="#231b33" stroke-width="2.2" stroke-linejoin="round">
      <path d="M83 103 Q99 91 117 106 Q99 119 83 103 Z"/>
      <path d="M173 103 Q157 91 139 106 Q157 119 173 103 Z"/>
    </g>

    <!-- focinho: o contorno do focinho comprido, o nariz grande e a boca -->
    <!-- as laterais do focinho (cara comprida de lobo, não redonda de gato) -->
    <path d="M114 110 Q110 120 106 130 Q112 140 122 143" fill="none" stroke="#cfc8da" stroke-width="2" stroke-linecap="round"/>
    <path d="M142 110 Q146 120 150 130 Q144 140 134 143" fill="none" stroke="#cfc8da" stroke-width="2" stroke-linecap="round"/>
    <path d="M113 126 Q128 117 143 126 Q142 137 128 140 Q114 137 113 126 Z" fill="#14101c"/>
    <path d="M113 126 Q128 117 143 126 Q142 137 128 140 Q114 137 113 126 Z" fill="none" stroke="#d946ef" stroke-width="2" stroke-opacity="0.8" filter="url(#neon)"/>
    <ellipse cx="122" cy="125" rx="4" ry="2" fill="#ffffff" fill-opacity="0.75"/>
    <path d="M128 140 V145 M128 145 Q120 150 112 145 M128 145 Q136 150 144 145" fill="none" stroke="#231b33" stroke-width="2.6" stroke-linecap="round"/>

    <!-- o terminal -->
    <rect x="30" y="150" width="196" height="76" rx="10" fill="#0a050f"/>
    <rect x="30" y="150" width="196" height="76" rx="10" fill="none" stroke="#9333ea" stroke-width="5" filter="url(#neon)"/>
    <g filter="url(#neon)" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M58 172 L76 186 L58 200"/>
    </g>
    <rect x="86" y="196" width="30" height="7" rx="2" fill="#22c55e" filter="url(#neon)"/>
    <circle cx="204" cy="168" r="5" fill="#f43f5e" filter="url(#neon)"/>

    <!-- patinhas brancas na borda -->
    <g fill="#ece8f2" stroke="#231b33" stroke-width="2">
      <rect x="64" y="141" width="40" height="20" rx="10"/>
      <rect x="152" y="141" width="40" height="20" rx="10"/>
    </g>
    <path d="M77 151 V160 M90 151 V160 M165 151 V160 M178 151 V160" stroke="#231b33" stroke-width="2.6" stroke-linecap="round"/>

    <!-- glitch -->
    <rect x="34" y="78" width="62" height="3" fill="#06b6d4" fill-opacity="0.5"/>
    <rect x="164" y="128" width="48" height="2" fill="#f472b6" fill-opacity="0.45"/>

  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="51" fill="none" stroke="#9333ea" stroke-opacity="0.45" stroke-width="3"/>
</svg>
