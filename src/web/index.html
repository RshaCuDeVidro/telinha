<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>telinha</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M6.5 9.5l2.5 2-2.5 2M11 14h4"/><path d="M8 20.5h8"/></svg><b>telinha</b></div>
  <div class="room"><span id="room-name"></span> <span id="chan" class="chan"></span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="status-text"></span></div>
  <button id="btn-side" class="icon-btn" type="button" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg></button>
</header>

<main id="join" class="join" hidden>
  <form id="join-form" class="card">
    <h1 id="t-join-title"></h1>
    <p id="t-join-sub" class="muted"></p>
    <label><span id="t-name"></span><input id="in-name" maxlength="32" autocomplete="nickname" required></label>
    <label id="pw-row"><span id="t-pass"></span><input id="in-pass" type="password" autocomplete="off"></label>
    <button id="btn-join" type="submit"></button>
    <p id="join-err" class="err" role="alert"></p>
  </form>
  <p id="t-nosupport" class="err" hidden></p>
</main>

<main id="room" class="room-layout" hidden>
  <section class="stage-col">
    <div id="chans" class="chans" hidden></div>
    <div id="streams" class="streams" role="tablist"></div>
    <div id="stage" class="stage">
      <canvas id="video" aria-label="vídeo"></canvas>
      <video id="mvideo" muted playsinline autoplay disablepictureinpicture hidden></video>
      <canvas id="cursor" class="cursor-layer" aria-hidden="true"></canvas>
      <div id="empty" class="empty"></div>
      <button id="sound-pill" class="sound-pill" type="button" hidden></button>
      <div id="dbg" class="dbg" hidden><pre id="dbg-text"></pre><button id="dbg-copy" class="ctl" type="button">copiar</button></div>
      <div class="controls">
        <button id="btn-sound" class="ctl"></button>
        <input id="vol" type="range" min="0" max="100" value="100" aria-label="volume">
        <span id="info" class="info"></span>
        <button id="btn-cinema" class="ctl sq" type="button"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9h19M2.5 15h19"/></svg></button>
        <button id="btn-full" class="ctl sq" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </section>
  <aside class="side">
    <h2 id="t-people"></h2>
    <ul id="people" class="people"></ul>
    <h2 id="t-chat"></h2>
    <div id="chat" class="chat" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-in" maxlength="4000" autocomplete="off">
      <button id="btn-send" type="submit" aria-label="enviar"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
    </form>
  </aside>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
